<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Catan Game History</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#20312b;--paper:#f6f1e5;--card:#fffdf8;--sea:#24797d;--clay:#b85739;--line:#d9cfb9;--muted:#68736c}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:"Nunito Sans",Arial,sans-serif}.page{width:min(1180px,calc(100% - 40px));margin:auto;padding:clamp(22px,5vw,58px) 0 32px}header{display:flex;align-items:end;justify-content:space-between;gap:20px;border-bottom:2px solid var(--ink);padding-bottom:18px}.eyebrow{margin:0 0 8px;color:var(--muted);font-size:.7rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1{margin:0;font-size:clamp(2rem,4vw,3.3rem);letter-spacing:-.065em;line-height:.95}.back{color:var(--sea);font-size:.82rem;font-weight:800;text-decoration:none;white-space:nowrap}.back:hover{text-decoration:underline;text-underline-offset:3px}.card{margin-top:24px;padding:clamp(16px,3vw,28px);overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;text-align:left}th{padding:0 12px 12px;font-size:.67rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}td{padding:14px 12px;border-top:1px solid #e7dfcf;font-size:.88rem;vertical-align:middle}th:first-child,td:first-child{padding-left:0}th:last-child,td:last-child{padding-right:0}.game-link{display:inline-grid;place-items:center;min-width:34px;height:30px;padding:0 9px;border-radius:999px;background:var(--sea);color:#fff;font-size:.76rem;font-weight:800;text-decoration:none}.game-link:hover{background:#17666a}.winner{font-weight:800}.players{color:var(--muted)}.status{padding:6px 0;color:var(--muted)}@media(max-width:560px){.page{width:100%;padding:calc(18px + env(safe-area-inset-top)) 15px 24px}header{align-items:start;padding-bottom:14px}.eyebrow{margin-bottom:5px}h1{font-size:1.9rem}.back{margin-top:6px;font-size:.75rem}.card{margin-top:15px;padding:14px;overflow:visible}table,tbody,tr,td{display:block}thead{display:none}tr{padding:13px 0;border-top:1px solid #e7dfcf}tr:first-child{border-top:0;padding-top:0}td{border:0;padding:0}td:first-child{float:right;margin-left:12px}td:nth-child(2){margin-bottom:4px;font-size:.78rem;color:var(--muted)}td:nth-child(3){font-size:.76rem;color:var(--muted)}td:nth-child(4){margin-top:5px;font-size:.82rem}.game-link::before{content:"Game "}.players::before{content:"Players: "}.winner::before{content:"Winner: "}}
  </style>
  <style>
    /* Match the shared advanced-stats page shell. */
    .page{padding:clamp(22px,5vw,58px) 0 32px}
    header{align-items:start;padding-bottom:20px}
    header .back{display:inline-block;margin:0;color:var(--sea);font-size:.78rem}
    header h1{margin:13px 0 0;font-size:clamp(2rem,5vw,3.6rem);line-height:.95;letter-spacing:-.06em}
    .card{margin-top:28px;padding:clamp(15px,3vw,28px)}
    .game-link{display:inline;color:var(--sea);background:transparent;width:auto;min-width:0;height:auto;padding:0;border-radius:0;font-size:.78rem;font-weight:800;text-decoration:none}
    .game-link:hover{background:transparent;color:var(--sea);text-decoration:underline;text-underline-offset:3px}
    .players-card h2{margin:0;font-size:1.3rem;letter-spacing:-.03em}.players-card p{margin:4px 0 18px;color:var(--muted);font-size:.78rem}.player-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0;padding:0;list-style:none}.player{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid #e7dfcf;border-radius:8px;background:var(--card)}.player-icon{flex:0 0 auto;width:38px;height:38px}.player-name{display:block;font-size:.86rem;font-weight:800;line-height:1.1}.player-animal{display:block;margin-top:2px;color:var(--muted);font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
    @media(max-width:560px){.page{width:min(100% - 26px,1180px);padding-top:24px}.card{margin-top:17px;padding:14px 10px}.game-link{display:inline;font-size:.78rem}.game-link::before{content:none}td:first-child{float:none;margin:0 0 4px;font-size:.78rem;color:var(--muted)}td:nth-child(2){margin:0;font-size:.76rem;color:var(--muted)}td:nth-child(3){margin-top:5px;font-size:.82rem;color:var(--ink)}td:nth-child(4){margin-top:7px}.players-card h2{font-size:1.15rem}.player-list{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.player{gap:8px;padding:8px}.player-icon{width:34px;height:34px}.player-name{font-size:.78rem}.player-animal{font-size:.57rem}}
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div>
        <a class="back" href="index.html">Start new game →</a>
        <h1>Game history</h1>
      </div>
    </header>
    <section class="card" aria-label="Recorded Catan games">
      <div class="status" id="status" role="status">Loading games…</div>
      <table id="games-table" hidden>
        <thead><tr><th>Date</th><th>Players</th><th>Winner</th><th>Dice tracker</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
    <section class="card players-card" id="players-card" hidden aria-labelledby="players-heading">
      <h2 id="players-heading">Players</h2>
      <p>Everyone who has joined a recorded game.</p>
      <ul class="player-list" id="player-list"></ul>
    </section>
  </main>
  <script>
    const formatDate=date=>new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(`${date}T00:00:00Z`));
    const table=document.getElementById('games-table');
    const status=document.getElementById('status');
    const playerIcons={
      Ryan:{animal:'Fox',color:'#c45e3d',svg:'<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="currentColor" d="m8 17 4-12 10 7h4l10-7 4 12v15c0 7-7 11-16 11S8 39 8 32z"/><path fill="#fffdf8" d="M14 27c3 9 17 12 20 0l-5 2h-10z"/><circle cx="18" cy="23" r="2" fill="#20312b"/><circle cx="30" cy="23" r="2" fill="#20312b"/><path d="M22 30h4l-2 3z" fill="#20312b"/></svg>'},
      Andrew:{animal:'Owl',color:'#687da4',svg:'<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="currentColor" d="M10 17 14 8l7 5a12 12 0 0 1 6 0l7-5 4 9v15c0 7-6 11-14 11S10 39 10 32z"/><circle cx="18" cy="25" r="7" fill="#fffdf8"/><circle cx="30" cy="25" r="7" fill="#fffdf8"/><circle cx="18" cy="25" r="2" fill="#20312b"/><circle cx="30" cy="25" r="2" fill="#20312b"/><path d="m21 32 3-5 3 5z" fill="#d9a936"/></svg>'},
      Dylan:{animal:'Bear',color:'#8d6a43',svg:'<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="14" cy="14" r="7" fill="currentColor"/><circle cx="34" cy="14" r="7" fill="currentColor"/><circle cx="24" cy="27" r="17" fill="currentColor"/><ellipse cx="24" cy="32" rx="8" ry="6" fill="#fffdf8"/><circle cx="18" cy="25" r="2" fill="#20312b"/><circle cx="30" cy="25" r="2" fill="#20312b"/><path d="M21 30h6l-3 3z" fill="#20312b"/></svg>'},
      Jacob:{animal:'Wolf',color:'#54899a',svg:'<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="currentColor" d="m8 17 3-13 11 8h4l11-8 3 13v16c0 7-7 10-16 10S8 40 8 33z"/><path fill="#fffdf8" d="M14 29c2 10 18 10 20 0l-5 2h-10z"/><circle cx="18" cy="23" r="2" fill="#20312b"/><circle cx="30" cy="23" r="2" fill="#20312b"/><path d="m21 30 3-3 3 3-3 3z" fill="#20312b"/></svg>'},
      Mike:{animal:'Turtle',color:'#579365',svg:'<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="26" r="16" fill="currentColor"/><path d="M24 11v30M10 26h28M14 16l20 20M34 16 14 36" stroke="#fffdf8" stroke-width="2" opacity=".8"/><circle cx="24" cy="8" r="6" fill="currentColor"/><circle cx="22" cy="7" r="1.5" fill="#20312b"/><circle cx="26" cy="7" r="1.5" fill="#20312b"/></svg>'},
      Will:{animal:'Falcon',color:'#816ca6',svg:'<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="currentColor" d="M24 5c10 2 15 10 14 22-1 10-7 16-14 16S10 37 10 27C9 15 14 7 24 5z"/><path fill="#fffdf8" d="M15 24h18l-9 14z"/><circle cx="19" cy="21" r="2" fill="#20312b"/><circle cx="29" cy="21" r="2" fill="#20312b"/><path d="m21 27 3-6 3 6z" fill="#d9a936"/></svg>'},
      Isa:{animal:'Cat',color:'#cf6f92',svg:'<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="currentColor" d="m9 16 2-12 11 8h4l11-8 2 12v17c0 7-7 10-15 10S9 40 9 33z"/><circle cx="18" cy="25" r="2" fill="#fffdf8"/><circle cx="30" cy="25" r="2" fill="#fffdf8"/><path d="M22 30h4l-2 2zM11 30h9m8 0h9" stroke="#fffdf8" stroke-width="1.5" stroke-linecap="round"/></svg>'},
      Renee:{animal:'Rabbit',color:'#b58761',svg:'<svg viewBox="0 0 48 48" aria-hidden="true"><ellipse cx="16" cy="13" rx="5" ry="11" fill="currentColor" transform="rotate(-12 16 13)"/><ellipse cx="32" cy="13" rx="5" ry="11" fill="currentColor" transform="rotate(12 32 13)"/><circle cx="24" cy="28" r="16" fill="currentColor"/><ellipse cx="24" cy="33" rx="8" ry="6" fill="#fffdf8"/><circle cx="18" cy="26" r="2" fill="#20312b"/><circle cx="30" cy="26" r="2" fill="#20312b"/><path d="m21 31 3-2 3 2-3 3z" fill="#cf6f92"/></svg>'},
      Carli:{animal:'Otter',color:'#4f919c',svg:'<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="14" cy="18" r="6" fill="currentColor"/><circle cx="34" cy="18" r="6" fill="currentColor"/><ellipse cx="24" cy="28" rx="17" ry="15" fill="currentColor"/><ellipse cx="24" cy="32" rx="9" ry="6" fill="#fffdf8"/><circle cx="18" cy="27" r="2" fill="#20312b"/><circle cx="30" cy="27" r="2" fill="#20312b"/><path d="M21 31h6l-3 3z" fill="#20312b"/></svg>'},
      Meghan:{animal:'Deer',color:'#a86b4c',svg:'<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M16 17V7m0 5-4-4m4 0 4-4M32 17V7m0 5-4-4m4 0 4-4" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path fill="currentColor" d="m12 16 6-6h12l6 6v17c0 7-5 10-12 10s-12-3-12-10z"/><ellipse cx="24" cy="33" rx="7" ry="5" fill="#fffdf8"/><circle cx="19" cy="25" r="2" fill="#20312b"/><circle cx="29" cy="25" r="2" fill="#20312b"/><path d="M22 31h4l-2 2z" fill="#20312b"/></svg>'}
    };
    const fallbackIcon={animal:'Panda',color:'#68736c',svg:'<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="14" cy="15" r="7" fill="currentColor"/><circle cx="34" cy="15" r="7" fill="currentColor"/><circle cx="24" cy="28" r="17" fill="currentColor"/><ellipse cx="18" cy="26" rx="5" ry="6" fill="#fffdf8"/><ellipse cx="30" cy="26" rx="5" ry="6" fill="#fffdf8"/><circle cx="18" cy="26" r="2" fill="#20312b"/><circle cx="30" cy="26" r="2" fill="#20312b"/><path d="M21 32h6l-3 3z" fill="#20312b"/></svg>'};
    fetch('games.json')
      .then(response=>{if(!response.ok)throw new Error('Could not load the game log.');return response.json()})
      .then(games=>{
        table.querySelector('tbody').innerHTML=games.map(game=>`<tr><td>${formatDate(game.date)}</td><td class="players">${game.players.join(', ')}</td><td class="winner">${game.winner}</td><td><a class="game-link" href="advanced-stats.html#r=${game.rolls}">View stats →</a></td></tr>`).join('');
        status.hidden=true;
        table.hidden=false;
        const players=[...new Set(games.flatMap(game=>game.players))];
        document.getElementById('player-list').innerHTML=players.map(name=>{const icon=playerIcons[name]||fallbackIcon;return `<li class="player"><span class="player-icon" style="color:${icon.color}">${icon.svg}</span><span><span class="player-name">${name}</span><span class="player-animal">${icon.animal}</span></span></li>`}).join('');
        document.getElementById('players-card').hidden=false;
      })
      .catch(()=>{status.textContent='Unable to load the game log. Try reloading the page.'});
  </script>
</body>
</html>
