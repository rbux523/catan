<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Catan Game History</title><link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#20312b;--paper:#f6f1e5;--card:#fffdf8;--sea:#24797d;--line:#d9cfb9;--muted:#68736c}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:"Nunito Sans",Arial,sans-serif}.page{width:min(1180px,calc(100% - 40px));margin:auto;padding:clamp(22px,5vw,58px) 0 32px}.is-loading{visibility:hidden}header{padding-bottom:20px;border-bottom:2px solid var(--ink)}.back,.game-link{color:var(--sea);font-size:.78rem;font-weight:800;text-decoration:none}.back:hover,.game-link:hover{text-decoration:underline;text-underline-offset:3px}h1{margin:13px 0 0;font-size:clamp(2rem,5vw,3.6rem);line-height:.95;letter-spacing:-.06em}.card{margin-top:28px;padding:clamp(15px,3vw,28px);background:var(--card);border:1px solid var(--line);border-radius:10px}.status{padding:6px 0;color:var(--muted)}table{width:100%;border-collapse:collapse;text-align:left}th{padding:0 7px 9px;color:var(--muted);font-size:.66rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}td{padding:11px 7px;border-top:1px solid #e8dfcf;font-size:.88rem;vertical-align:middle}.players{color:var(--muted)}.winner{font-weight:800}.players-card h2{margin:0;font-size:1.3rem;letter-spacing:-.03em}.players-card p{margin:4px 0 18px;color:var(--muted);font-size:.78rem}.player-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0;padding:0;list-style:none}.player{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid #e7dfcf;border-radius:8px;background:var(--card);color:var(--ink);text-decoration:none;transition:transform .15s,background .15s,border-color .15s,box-shadow .15s}.player:hover{transform:translateY(-2px);background:#edf5f2;border-color:#8eb8b4;box-shadow:0 4px 10px #20312b12}.player:focus-visible{outline:2px solid var(--sea);outline-offset:2px}.player-icon{flex:0 0 auto;width:38px;height:38px}.player-name{display:block;font-size:.86rem;font-weight:800;line-height:1.1}.player-animal{display:block;margin-top:2px;color:var(--muted);font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em}@media(max-width:560px){.page{width:min(100% - 26px,1180px);padding-top:24px}header{padding-bottom:16px}h1{font-size:1.9rem}.card{margin-top:17px;padding:14px 10px}table,tbody,tr,td{display:block}thead{display:none}tr{padding:13px 0;border-top:1px solid #e7dfcf}tr:first-child{border-top:0;padding-top:0}td{border:0;padding:0}td:first-child{margin-bottom:4px;font-size:.78rem;color:var(--muted)}td:nth-child(2){font-size:.76rem;color:var(--muted)}td:nth-child(3){margin-top:5px;font-size:.82rem}td:nth-child(4){margin-top:7px}.players-card h2{font-size:1.15rem}.player-list{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.player{gap:8px;padding:8px}.player-icon{width:34px;height:34px}.player-name{font-size:.78rem}.player-animal{font-size:.57rem}}
  </style>
</head>
<body>
  <main class="page is-loading"><header><a class="back" href="index.html">Start new game →</a><h1>Game history</h1></header>
    <section class="card" aria-label="Recorded Catan games"><div class="status" id="status" role="status">Loading games…</div><table id="games-table" hidden><thead><tr><th>Date</th><th>Players</th><th>Winner</th><th>Dice tracker</th></tr></thead><tbody></tbody></table></section>
    <section class="card players-card" id="players-card" hidden aria-labelledby="players-heading"><h2 id="players-heading">Players</h2><p>Everyone who has joined a recorded game.</p><ul class="player-list" id="player-list"></ul></section>
  </main>
  <script>
    const formatDate=date=>new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(`${date}T00:00:00Z`));
    const loadJson=path=>fetch(path).then(response=>{if(!response.ok)throw new Error();return response.json()});
    const table=document.getElementById('games-table'),status=document.getElementById('status');
    Promise.all([loadJson('games.json'),loadJson('players.json')]).then(([games,profiles])=>{
      table.querySelector('tbody').innerHTML=games.map(game=>`<tr><td>${formatDate(game.date)}</td><td class="players">${game.players.join(', ')}</td><td class="winner">${game.winner}</td><td><a class="game-link" href="advanced-stats.html#r=${game.rolls}">View stats →</a></td></tr>`).join('');
      const players=[...new Set(games.flatMap(game=>game.players))];
      document.getElementById('player-list').innerHTML=players.map(name=>{const player=profiles[name]||profiles.fallback;return `<li><a class="player" href="player.html?name=${encodeURIComponent(name)}"><img class="player-icon" src="${player.icon}" alt=""><span><span class="player-name">${name}</span><span class="player-animal">${player.animal}</span></span></a></li>`}).join('');
      status.hidden=true;table.hidden=false;document.getElementById('players-card').hidden=false;document.querySelector('.page').classList.remove('is-loading');
    }).catch(()=>{status.textContent='Unable to load the game log. Try reloading the page.';document.querySelector('.page').classList.remove('is-loading')});
  </script>
</body>
</html>
