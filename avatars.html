<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Catan Avatar Library</title><link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#20312b;--paper:#f6f1e5;--card:#fffdf8;--sea:#24797d;--line:#d9cfb9;--muted:#68736c}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:"Nunito Sans",Arial,sans-serif}.page{width:min(1180px,calc(100% - 40px));margin:auto;padding:clamp(22px,5vw,58px) 0 32px}.is-loading{visibility:hidden}header{padding-bottom:20px;border-bottom:2px solid var(--ink)}.back{color:var(--sea);font-size:.78rem;font-weight:800;text-decoration:none}.back:hover{text-decoration:underline;text-underline-offset:3px}h1{margin:13px 0 0;font-size:clamp(2rem,5vw,3.6rem);line-height:.95;letter-spacing:-.06em}.intro{margin:8px 0 0;color:var(--muted);font-size:.92rem}.toolbar{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-top:28px}.count{margin:0;color:var(--muted);font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.search{width:min(340px,100%);padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-size:.88rem;outline:none}.search:focus{border-color:var(--sea);box-shadow:0 0 0 3px #24797d1c}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px;margin-top:18px}.avatar{display:flex;min-height:166px;flex-direction:column;align-items:center;justify-content:center;gap:11px;padding:15px 10px;background:var(--card);border:1px solid var(--line);border-radius:10px;text-align:center;transition:transform .15s,background .15s,border-color .15s,box-shadow .15s}.avatar:hover{transform:translateY(-2px);background:#edf5f2;border-color:#8eb8b4;box-shadow:0 4px 10px #20312b12}.avatar img{width:88px;height:88px;object-fit:contain}.avatar span{font-size:.78rem;font-weight:800;line-height:1.15}.empty{margin-top:18px;padding:32px;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--muted);text-align:center}.error{padding:16px 0;color:var(--muted)}@media(max-width:560px){.page{width:min(100% - 26px,1180px);padding-top:24px}header{padding-bottom:16px}h1{font-size:1.9rem}.toolbar{align-items:stretch;flex-direction:column;gap:10px;margin-top:18px}.search{width:100%}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}.avatar{min-height:134px;padding:10px 6px;gap:7px}.avatar img{width:66px;height:66px}.avatar span{font-size:.67rem}.count{font-size:.66rem}}
  </style>
</head>
<body>
  <main class="page is-loading"><header><a class="back" href="games.html">← Game history</a><h1>Avatar library</h1><p class="intro">A collection of character avatars for future player profiles.</p></header><section class="toolbar" aria-label="Avatar search"><p class="count" id="count">Loading avatars…</p><input class="search" id="search" type="search" autocomplete="off" placeholder="Search avatars" aria-label="Search avatars"></section><section class="grid" id="grid" aria-live="polite"></section><p class="empty" id="empty" hidden>No avatars match that search.</p><p class="error" id="error" hidden>Unable to load the avatar library. Try reloading the page.</p></main>
  <script>
    const grid=document.getElementById('grid'),search=document.getElementById('search'),count=document.getElementById('count'),empty=document.getElementById('empty'),error=document.getElementById('error');
    const escapeHtml=value=>value.replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    let avatars=[];
    function render(){const query=search.value.trim().toLowerCase();const filtered=avatars.filter(avatar=>`${avatar.name} ${avatar.description}`.toLowerCase().includes(query));grid.innerHTML=filtered.map(avatar=>`<article class="avatar"><img src="${encodeURI(avatar.file)}" alt="${escapeHtml(avatar.name)} avatar"><span>${escapeHtml(avatar.name)}</span></article>`).join('');count.textContent=`${filtered.length} ${filtered.length===1?'avatar':'avatars'}`;empty.hidden=filtered.length!==0}
    fetch('avatars.json').then(response=>{if(!response.ok)throw new Error();return response.json()}).then(data=>{avatars=data;render();document.querySelector('.page').classList.remove('is-loading')}).catch(()=>{error.hidden=false;count.hidden=true;document.querySelector('.page').classList.remove('is-loading')});
    search.addEventListener('input',render);
  </script>
</body>
</html>
