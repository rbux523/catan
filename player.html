<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Player Stats — Catan Dice Tracker</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#20312b;--paper:#f6f1e5;--card:#fffdf8;--sea:#24797d;--clay:#b85739;--line:#d9cfb9;--muted:#68736c}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:"Nunito Sans",Arial,sans-serif}.page{width:min(1180px,calc(100% - 40px));margin:auto;padding:clamp(22px,5vw,58px) 0 32px}.is-loading{visibility:hidden}header{padding-bottom:20px;border-bottom:2px solid var(--ink)}.back,.game-link{color:var(--sea);font-size:.78rem;font-weight:800;text-decoration:none}.back:hover,.game-link:hover{text-decoration:underline;text-underline-offset:3px}.profile{display:flex;align-items:center;gap:18px;margin-top:13px}.profile-icon{flex:0 0 auto;width:84px;height:84px}.eyebrow{margin:0 0 4px;color:var(--muted);font-size:.7rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1{margin:0;font-size:clamp(2.5rem,7vw,5.2rem);line-height:.86;letter-spacing:-.075em}.animal{margin:8px 0 0;color:var(--muted);font-size:.84rem}.card{margin-top:28px;padding:clamp(15px,3vw,28px);background:var(--card);border:1px solid var(--line);border-radius:10px}.summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:28px}.summary-grid .card{margin:0}.stat-label{margin:0;color:var(--muted);font-size:.7rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.stat-value{margin:10px 0 0;font-size:clamp(5.5rem,15vw,10rem);font-weight:800;letter-spacing:-.1em;line-height:.7}.percent-value{font-size:clamp(2.8rem,7vw,5rem);letter-spacing:-.07em;line-height:.8}.stat-copy{margin:12px 0 0;max-width:270px;color:var(--muted);font-size:.82rem;line-height:1.4}.card h2{margin:0 0 4px;font-size:1.3rem;letter-spacing:-.03em}.card p{margin:0 0 18px;color:var(--muted);font-size:.78rem}table{width:100%;border-collapse:collapse}th{padding:0 7px 9px;color:var(--muted);font-size:.66rem;font-weight:800;letter-spacing:.1em;text-align:left;text-transform:uppercase}td{padding:11px 7px;border-top:1px solid #e8dfcf;font-size:.88rem;vertical-align:middle}.players{color:var(--muted)}.result{font-weight:800}.result.won{color:#147050}.pre-tracker{color:var(--muted);font-size:.74rem;font-weight:800}.empty{padding:20px 0;color:var(--muted)}@media(max-width:560px){.page{width:min(100% - 26px,1180px);padding-top:24px}header{padding-bottom:16px}.profile{gap:12px}.profile-icon{width:62px;height:62px}h1{font-size:2.75rem}.animal{margin-top:5px;font-size:.75rem}.card{margin-top:17px;padding:14px 10px}.summary-grid{gap:9px;margin-top:17px}.summary-grid .card{padding:14px}.stat-value{font-size:6rem}.percent-value{font-size:2.8rem}.stat-copy{margin-top:9px;font-size:.68rem}table,tbody,tr,td{display:block}thead{display:none}tr{padding:13px 0;border-top:1px solid #e7dfcf}tr:first-child{border-top:0;padding:0}td{border:0;padding:0}td:first-child{margin-bottom:4px;font-size:.78rem;color:var(--muted)}td:nth-child(2){font-size:.76rem;color:var(--muted)}td:nth-child(3){margin-top:5px;font-size:.82rem}td:nth-child(4){margin-top:7px}}
  </style>
  <style>
    @media(max-width:560px){#games-card{overflow:visible}#games-card table{display:table;width:100%;min-width:0;table-layout:fixed}#games-card thead{display:table-header-group}#games-card tbody{display:table-row-group}#games-card tr{display:table-row;padding:0;border:0}#games-card td{display:table-cell;margin:0!important;padding:9px 4px;border-top:1px solid #e8dfcf;font-size:.72rem;overflow-wrap:break-word}#games-card th{display:table-cell;padding:0 4px 8px;font-size:.56rem}#games-card th:nth-child(1){width:17%}#games-card th:nth-child(2){width:45%}#games-card th:nth-child(3){width:16%}#games-card th:nth-child(4){width:22%}#games-card td:nth-child(n){color:inherit}#games-card .players{color:var(--muted)}#games-card .game-link{white-space:nowrap}}
  </style>
  <style>
    .summary-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
    .stat-card{display:grid;grid-template-rows:auto 1fr;min-height:220px;text-align:left}.stat-card .stat-value,.stat-card .games-value,.stat-card .percent-value{align-self:center;justify-self:center;margin:12px 0 0;padding:0;background:transparent;color:var(--sea);font-size:clamp(2.5rem,7vw,5.2rem);letter-spacing:-.08em;line-height:1}
    @media(max-width:560px){.summary-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.stat-card{min-height:154px;padding:12px!important}.stat-card .stat-value,.stat-card .games-value,.stat-card .percent-value{font-size:2.75rem}}
  </style>
  <style>@media(max-width:560px){tr:first-child{padding-top:0}}</style>
  <style>@media(max-width:560px){#games-card th:nth-child(2){width:35%}}</style>
  <style>@media(max-width:560px){#games-card th:nth-child(1){width:23%}#games-card th:nth-child(2){width:35%}#games-card th:nth-child(3){width:17%}#games-card th:nth-child(4){width:25%}#games-card td:first-child{white-space:nowrap}#games-card .pre-tracker{font-size:0}#games-card .pre-tracker::after{content:"Pre-tracker";font-size:.74rem}}</style>
</head>
<body>
  <main class="page is-loading">
    <header>
      <a class="back" href="games.html">← Game history</a>
      <div class="profile" id="profile" hidden>
        <img class="profile-icon" id="profile-icon" alt="">
        <div><p class="eyebrow">Catan Dice Tracker</p><h1 id="player-name"></h1><p class="animal" id="player-animal"></p></div>
      </div>
      <h1 id="missing-player" hidden>Player not found</h1>
    </header>
    <section class="summary-grid" id="summary" hidden>
      <article class="card stat-card"><p class="stat-label">Wins</p><p class="stat-value" id="wins">0</p></article>
      <article class="card stat-card"><p class="stat-label">Games played</p><p class="stat-value games-value" id="games-played">0</p></article>
      <article class="card stat-card"><p class="stat-label">Win percentage</p><p class="stat-value percent-value" id="win-percentage">0%</p></article>
    </section>
    <section class="card" id="games-card" hidden aria-labelledby="games-heading">
      <h2 id="games-heading">Games played</h2>
      <p>Every recorded game featuring this player.</p>
      <table><thead><tr><th>Date</th><th>Players</th><th>Result</th><th>Dice tracker</th></tr></thead><tbody id="games-list"></tbody></table>
    </section>
    <p class="empty" id="status" role="status">Loading player stats…</p>
  </main>
  <script>
    const escapeHTML=value=>String(value).replace(/[&<>'"]/g,character=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[character]));
    const formatDate=date=>new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(`${date}T00:00:00Z`));
    const name=new URLSearchParams(location.search).get('name');
    const status=document.getElementById('status');
    const loadJson=path=>fetch(path).then(response=>{if(!response.ok)throw new Error();return response.json()});
    Promise.all([loadJson('games.json'),loadJson('players.json')])
      .then(([games,profiles])=>{
        const played=games.filter(game=>game.players.includes(name));
        if(!name||!played.length){document.getElementById('missing-player').hidden=false;status.textContent='Choose a player from the game history to see their stats.';document.querySelector('.page').classList.remove('is-loading');return}
        const icon=profiles[name]||profiles.fallback;
        const wins=played.filter(game=>game.winner===name).length;
        document.title=`${name} — Catan Dice Tracker`;
        document.getElementById('profile-icon').src=icon.icon;
        document.getElementById('profile-icon').alt=`${icon.avatar} avatar`;
        document.getElementById('player-name').textContent=name;
        document.getElementById('player-animal').textContent=icon.avatar;
        document.getElementById('wins').textContent=wins;
        document.getElementById('games-played').textContent=played.length;
        document.getElementById('win-percentage').textContent=`${Math.round(wins/played.length*100)}%`;
        document.getElementById('games-list').innerHTML=played.map(game=>{const won=game.winner===name;return `<tr><td>${formatDate(game.date)}</td><td class="players">${game.players.map(escapeHTML).join(', ')}</td><td class="result ${won?'won':''}">${won?'Won':'Played'}</td><td>${game.rolls?`<a class="game-link" href="index.html#r=${game.rolls}">View stats →</a>`:'<span class="pre-tracker">Pre-tracker era</span>'}</td></tr>`}).join('');
        document.getElementById('profile').hidden=false;
        document.getElementById('summary').hidden=false;
        document.getElementById('games-card').hidden=false;
        status.hidden=true;document.querySelector('.page').classList.remove('is-loading');
      })
      .catch(()=>{status.textContent='Unable to load player stats. Try reloading the page.';document.querySelector('.page').classList.remove('is-loading')});
  </script>
</body>
</html>
